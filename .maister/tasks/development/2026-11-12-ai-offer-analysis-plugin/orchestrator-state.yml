task:
  title: AI offer analysis plugin (BAML + LiteLLM)
  description: >-
    Module 3 (Enterprise AI Architecture) exercise. Create a plugin integrated with the
    platform backend that uses BAML to call an LLM with structured output, all requests
    routed through LiteLLM. The plugin automatically checks the product description
    quality, verifies the assigned category fits, and assesses whether the price deviates
    significantly from market norms. Plugin served on port 3011. After implementation,
    verify in the LiteLLM panel that all model traffic is processed and visible in logs.
  status: completed
  tags: [plugin, ai, baml, litellm, module-3]
  priority: null

