task:
  title: Shipping plugin (carriers, delivery methods, per-product restrictions, port 3010)
  description: >-
    Build a logistics plugin: (1) global management of carriers and delivery methods
    (DHL, DPD, InPost, Poczta etc.) for the whole system; (2) per-product restriction of
    shipping methods - an administrator can disable a method for a product that does not
    fit its standard (e.g. oversized); (3) plugin dev server on port 3010 to keep it
    separate from future modules. Pre-agreed decisions (plan mode): opt-out model stored
    as product pluginData {disabledMethodIds}; methods carry optional max LxWxH (cm) and
    the product tab warns (no auto-disable) using box-size plugin dimensions; admin =
    PERMISSION_EDIT (no backend changes, UI hides write controls via JWT); port 3010 with
    strictPort and docs updated to reserve 3010+ for new business modules; no weight limit.
    Initial plan: analysis/initial-plan.md
  status: completed
  tags: [plugin, shipping, frontend]
  priority: null

