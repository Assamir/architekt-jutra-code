databaseChangeLog:
  - changeSet:
      id: 012-insert-shipping-sample-data
      author: aj
      context: dev
      comment: Sample carriers and shipping methods for the shipping plugin (plugin_objects requires the plugin row)
      changes:
        - sql:
            sql: >
              INSERT INTO plugins (id, name, version, url, description, enabled, manifest, created_at, updated_at)
              VALUES ('shipping', 'Shipping', '1.0.0', 'http://localhost:3010',
                'Carriers, delivery methods and per-product shipping restrictions', true,
                '{"name": "Shipping", "version": "1.0.0", "url": "http://localhost:3010",
                  "description": "Carriers, delivery methods and per-product shipping restrictions",
                  "extensionPoints": [
                    {"type": "menu.main", "label": "Shipping", "icon": "truck", "path": "/", "priority": 110},
                    {"type": "product.detail.tabs", "label": "Shipping", "path": "/product-shipping", "priority": 80}]}'::jsonb,
                CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING
        - sql:
            sql: >
              INSERT INTO plugin_objects (id, plugin_id, object_type, object_id, data, created_at, updated_at)
              SELECT nextval('plugin_object_seq'), 'shipping', object_type, object_id, data::jsonb, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
