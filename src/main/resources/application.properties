spring.application.name=aj
server.port=8180

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:i/WZnrbvFqiPfShuZjGmc5kC7IXxRZfpueJEdgCzGFc=}
app.jwt.expiration-ms=86400000

# OAuth2 authorization server: fixed issuer (also the host API audience base: <issuer>/api)
app.oauth2.issuer=${APP_OAUTH2_ISSUER:http://localhost:8180}
# Canonical resource (audience) of tokens issued for the MCP server, and the MCP server's own client credentials
app.oauth2.mcp-resource=${AJ_MCP_BASE_URL:http://localhost:8181}
app.oauth2.mcp-client-id=${AJ_OAUTH_CLIENT_ID:aj-mcp-server}
app.oauth2.mcp-client-secret=${AJ_OAUTH_CLIENT_SECRET:}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}

# Liquibase
spring.liquibase.contexts=dev

# Footprint module
app.footprint.problem-base-uri=/problems
# SPI adapters: "in-memory" activates the dev/test stubs in pl.devstyle.aj.footprint.spi.stub.
# In production, swap this to activate a real EFM-backed and Product-domain-backed adapter
# (or leave the stubs unloaded and supply your own beans).
app.footprint.adapters=in-memory
# Audit listener retry policy (consumed by spring-retry @Retryable on FootprintAuditListener).
app.footprint.audit.retry.max-attempts=3
app.footprint.audit.retry.delay-ms=200
app.footprint.audit.retry.multiplier=2.0
# Audit listener execution pool
app.footprint.audit.async.core-pool-size=2
app.footprint.audit.async.max-pool-size=8
app.footprint.audit.async.queue-capacity=100
